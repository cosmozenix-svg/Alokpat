    <script>
      // Client-side fallback router for static hosts (Vercel, GitHub Pages)
      (function() {
        try {
          var p = window.location.pathname.toLowerCase().replace(/\/+$/, '');
          var h = window.location.hash.toLowerCase();
          if ((p === '/admin' || p.endsWith('/admin')) && (!h || h === '#')) {
            window.location.hash = '/admin';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var _currentFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          
          // Provide both getter and setter for window.fetch so browser extensions can safely hook into fetch
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              }
            });
          } catch (e1) {
            try {
              var proto = Object.getPrototypeOf(window);
              if (proto) {
                Object.defineProperty(proto, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return _currentFetch;
                  },
                  set: function(fn) {
                    _currentFetch = fn;
                  }
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}

        // Global handler to intercept extension-injected script errors gracefully
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (
              event &&
              ((event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) ||
               (event.filename && event.filename.indexOf('chrome-extension://') !== -1))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (
              event && event.reason &&
              ((event.reason.message && event.reason.message.indexOf('fetch') !== -1 && event.reason.message.indexOf('getter') !== -1) ||
               (event.reason.stack && event.reason.stack.indexOf('chrome-extension://') !== -1))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
